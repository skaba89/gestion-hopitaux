# ============================================================================
# HealthFlow Guinea - CI Pipeline
# DataSphere Innovation
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop, 'phase-*', 'audit-*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://test:test@localhost:5432/healthflow_test?schema=public
  REDIS_URL: redis://localhost:6379/0
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: test-secret-for-ci-only
  JWT_SECRET: test-jwt-secret-for-ci-only
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
  DEMO_MODE: 'true'

jobs:
  validate:
    name: Validate codebase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: healthflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d healthflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint and typecheck
        run: npm run validate

      - name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
