# =============================================================================
# HealthFlow Guinea - Nginx Reverse Proxy Configuration (Production)
# Routes:
#   /            → Next.js Frontend (port 3000)
#   /api/        → Next.js API Routes (port 3000)
#   /storage/    → MinIO S3 Storage (port 9000)
#   /analytics/  → Apache Superset BI (port 8088)
# =============================================================================

# Upstream definitions
upstream frontend {
    server frontend:3000;
    keepalive 64;
}

upstream minio_api {
    server minio:9000;
    keepalive 32;
}

upstream minio_console {
    server minio:9001;
    keepalive 16;
}

upstream superset {
    server superset:8088;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

# Gzip compression settings
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

# Brotli compression (if module available)
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css application/javascript application/json;

# =============================================================================
# HTTP → HTTPS Redirect
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name healthflow.gn www.healthflow.gn;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# Main HTTPS Server
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name healthflow.gn www.healthflow.gn;

    # -----------------------------------------------------------------
    # SSL Configuration
    # -----------------------------------------------------------------
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # Modern TLS configuration (Mozilla Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # -----------------------------------------------------------------
    # Security Headers
    # -----------------------------------------------------------------
    # Content Security Policy - Healthcare-grade security
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://healthflow.gn; font-src 'self' data:; connect-src 'self' https://healthflow.gn wss://healthflow.gn; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy, but still useful for older browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy - minimal data leakage
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy - restrict browser features
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # HSTS - Force HTTPS (1 year, include subdomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # -----------------------------------------------------------------
    # General Settings
    # -----------------------------------------------------------------
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeout settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
    send_timeout 60s;

    # -----------------------------------------------------------------
    # Frontend - Next.js Application (/)
    # -----------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # WebSocket support for Next.js HMR (dev) and live features
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets from Next.js
        location ~* /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Cache images
        location ~* /_next/image {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # -----------------------------------------------------------------
    # API Routes (/api/)
    # -----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't cache API responses by default
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # Auth endpoints - stricter rate limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Health check endpoint - no rate limiting
    location /api/health {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # -----------------------------------------------------------------
    # MinIO S3 Storage (/storage/)
    # -----------------------------------------------------------------
    location /storage/ {
        # Rewrite /storage/ to / for MinIO API
        rewrite ^/storage/(.*) /$1 break;

        proxy_pass http://minio_api;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MinIO-specific headers
        proxy_set_header X-NginX-Proxy true;
        proxy_buffering off;
        proxy_request_buffering off;

        # Allow large file uploads for medical documents
        client_max_body_size 100M;

        # Timeouts for large file transfers
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MinIO Console (/storage-console/)
    location /storage-console/ {
        rewrite ^/storage-console/(.*) /$1 break;

        proxy_pass http://minio_console;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for MinIO console
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -----------------------------------------------------------------
    # Apache Superset Analytics (/analytics/)
    # -----------------------------------------------------------------
    location /analytics/ {
        proxy_pass http://superset/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /analytics;

        # WebSocket for Superset live queries
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Superset can have long-running queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # Cache Superset static assets
        location ~* /analytics/static/ {
            proxy_pass http://superset/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # -----------------------------------------------------------------
    # Favicon and robots
    # -----------------------------------------------------------------
    location = /favicon.ico {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location = /robots.txt {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    # -----------------------------------------------------------------
    # Deny access to hidden files
    # -----------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================================================
# Health Check Server (internal, no SSL)
# =============================================================================
server {
    listen 8080;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /nginx-status {
        stub_status on;
        access_log off;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
    }
}
