# HealthFlow Guinea — Netlify Configuration
[build]
  # Clean .next directory before build to avoid stale chunks from previous builds
  command = "rm -rf .next && npm run build"
  publish = ".next"

[build.environment]
  DEMO_MODE = "true"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

# Runtime environment variables for serverless functions
# These are available in API routes at runtime (not just during build)
[context.production.environment]
  DEMO_MODE = "true"

[context.deploy-preview.environment]
  DEMO_MODE = "true"

[context.branch-deploy.environment]
  DEMO_MODE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proper MIME type headers for static assets
[[headers]]
  for = "/_next/static/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for all other resources
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
